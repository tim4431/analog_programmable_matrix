<text x="44" y="83" font-size="19" text-anchor="start" fill="#223746">Nominal CAD check with all eight straight plugs attached</text>
<rect x="90" y="126" width="460" height="104" rx="4" fill="#647c89"/>
<text x="320" y="183" font-size="20" text-anchor="middle" fill="#ffffff">RAISED POWER HOOD</text>
